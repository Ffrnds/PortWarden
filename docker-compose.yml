services:
  prometheus:
    image: prom/prometheus:latest
    container_name: port-manager-prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '9090:9090'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: port-manager-grafana
    depends_on:
      - prometheus
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      # Host 3001, not 3000 — that's the API's default port (see .env.example).
      - '3001:3000'
    environment:
      # Local-only convenience: opens straight to the dashboard, no login
      # screen. Fine for a stack that only binds to localhost; revisit if
      # this ever needs to be reachable from anywhere else.
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: 'Admin'
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
    restart: unless-stopped

volumes:
  grafana-data:
