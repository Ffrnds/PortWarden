global:
  scrape_interval: 15s

scrape_configs:
  - job_name: port-manager-api
    # The API runs directly on Windows (see ARCHITECTURE.md — it needs real
    # host access for netstat/tasklist/taskkill), not inside this compose
    # stack. host.docker.internal is how a container reaches the host on
    # Docker Desktop for Windows.
    static_configs:
      - targets: ['host.docker.internal:3000']
